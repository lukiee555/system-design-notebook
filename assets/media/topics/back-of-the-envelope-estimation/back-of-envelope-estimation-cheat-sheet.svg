<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Back-of-the-envelope estimation cheat sheet</title>
  <desc id="desc">A handwritten notebook-style summary showing the estimation workflow, powers of two, latency hierarchy, availability downtime, and an illustrative tweet QPS and media storage calculation.</desc>
  <defs>
    <pattern id="paperLines" width="1600" height="44" patternUnits="userSpaceOnUse">
      <rect width="1600" height="44" fill="#fffdf7"/>
      <line x1="0" y1="43" x2="1600" y2="43" stroke="#cfe3f4" stroke-width="1.5" opacity="0.72"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#203040" flood-opacity="0.16"/>
    </filter>
    <filter id="roughBox" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="18" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#2456d8"/>
    </marker>
    <style>
      .title { font: 700 46px "Segoe Print", "Comic Sans MS", cursive; fill: #12202d; }
      .subtitle { font: 600 23px "Segoe Print", "Comic Sans MS", cursive; fill: #334555; }
      .section { font: 700 27px "Segoe Print", "Comic Sans MS", cursive; fill: #102333; }
      .body { font: 500 20px "Segoe Print", "Comic Sans MS", cursive; fill: #182b3a; }
      .small { font: 500 17px "Segoe Print", "Comic Sans MS", cursive; fill: #243a49; }
      .tiny { font: 500 15px "Segoe Print", "Comic Sans MS", cursive; fill: #2e4352; }
      .formula { font: 700 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #12202d; }
      .label { font: 700 18px "Segoe Print", "Comic Sans MS", cursive; fill: #102333; }
      .box { stroke-width: 3; rx: 18; ry: 18; filter: url(#softShadow); }
      .sketch { filter: url(#roughBox); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#paperLines)"/>
  <line x1="72" y1="0" x2="72" y2="1000" stroke="#f3a6a6" stroke-width="3" opacity="0.7"/>

  <g class="sketch">
    <rect x="335" y="24" width="930" height="74" rx="16" fill="#d8efff" stroke="#1d4f78" stroke-width="3"/>
  </g>
  <text x="800" y="74" text-anchor="middle" class="title">Chapter 2 — Back-of-the-Envelope Estimation</text>
  <text x="800" y="119" text-anchor="middle" class="subtitle">Make assumptions visible • Keep units visible • Preserve the right order of magnitude</text>

  <!-- Workflow -->
  <g>
    <rect class="box" x="95" y="155" width="620" height="310" fill="#fff3cf" stroke="#d58a17"/>
    <text x="125" y="195" class="section">1. Estimation workflow</text>

    <g class="sketch">
      <rect x="128" y="225" width="160" height="58" rx="14" fill="#e4f5ff" stroke="#2c79a8" stroke-width="2.5"/>
      <rect x="331" y="225" width="160" height="58" rx="14" fill="#e8f7df" stroke="#4d8c3d" stroke-width="2.5"/>
      <rect x="534" y="225" width="150" height="58" rx="14" fill="#fce5ef" stroke="#aa476f" stroke-width="2.5"/>
    </g>
    <text x="208" y="260" text-anchor="middle" class="label">Assumptions</text>
    <text x="411" y="260" text-anchor="middle" class="label">Average load</text>
    <text x="609" y="260" text-anchor="middle" class="label">Peak load</text>
    <line x1="289" y1="254" x2="323" y2="254" stroke="#2456d8" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="492" y1="254" x2="526" y2="254" stroke="#2456d8" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="130" y="319" class="formula">Average QPS = operations/day ÷ 86,400</text>
    <text x="130" y="356" class="formula">Peak QPS = average QPS × peak factor</text>
    <text x="130" y="393" class="formula">Storage = objects × bytes/object × retention</text>
    <text x="130" y="433" class="body">✓ Round sensibly   ✓ label units   ✓ sanity-check   ✓ state the design implication</text>
  </g>

  <!-- Power of two -->
  <g>
    <rect class="box" x="745" y="155" width="350" height="310" fill="#eaf4ff" stroke="#3f6fad"/>
    <text x="775" y="195" class="section">2. Data-size ladder</text>
    <text x="785" y="235" class="formula">2¹⁰ ≈ 1 thousand → KB</text>
    <text x="785" y="277" class="formula">2²⁰ ≈ 1 million  → MB</text>
    <text x="785" y="319" class="formula">2³⁰ ≈ 1 billion  → GB</text>
    <text x="785" y="361" class="formula">2⁴⁰ ≈ 1 trillion → TB</text>
    <text x="785" y="403" class="formula">2⁵⁰ ≈ 1 quadrillion → PB</text>
    <text x="785" y="440" class="small">1 byte = 8 bits • 1 ASCII character ≈ 1 byte</text>
  </g>

  <!-- Latency -->
  <g>
    <rect class="box" x="1125" y="155" width="380" height="310" fill="#eef9e8" stroke="#568f41"/>
    <text x="1155" y="195" class="section">3. Latency intuition</text>
    <text x="1155" y="231" class="small">Historical numbers change; the hierarchy matters.</text>

    <text x="1155" y="270" class="label">CPU cache / memory</text>
    <rect x="1335" y="249" width="78" height="26" rx="8" fill="#68b984"/>
    <text x="1374" y="268" text-anchor="middle" class="tiny">ns–µs</text>

    <text x="1155" y="315" class="label">Same data center</text>
    <rect x="1335" y="294" width="112" height="26" rx="8" fill="#67a9d8"/>
    <text x="1391" y="313" text-anchor="middle" class="tiny">~0.5 ms</text>

    <text x="1155" y="360" class="label">Disk / network MB</text>
    <rect x="1335" y="339" width="151" height="26" rx="8" fill="#e7a751"/>
    <text x="1410" y="358" text-anchor="middle" class="tiny">10–30 ms</text>

    <text x="1155" y="405" class="label">Cross-region</text>
    <rect x="1335" y="384" width="165" height="26" rx="8" fill="#dc6f78"/>
    <text x="1418" y="403" text-anchor="middle" class="tiny">~150 ms</text>

    <text x="1155" y="435" class="tiny">Memory fast • disk seeks slow • compression can beat transfer</text>
  </g>

  <!-- Availability -->
  <g>
    <rect class="box" x="95" y="495" width="520" height="405" fill="#f8eafb" stroke="#9253a4"/>
    <text x="125" y="535" class="section">4. Availability “nines”</text>
    <text x="125" y="568" class="small">A small percentage change can remove hours of allowable downtime.</text>

    <rect x="125" y="595" width="460" height="54" rx="10" fill="#e8d7ef"/>
    <text x="150" y="628" class="label">Availability</text>
    <text x="320" y="628" class="label">Downtime / year</text>

    <g class="body">
      <text x="160" y="690">99%</text><text x="340" y="690">3.65 days</text>
      <text x="160" y="735">99.9%</text><text x="340" y="735">8.77 hours</text>
      <text x="160" y="780">99.99%</text><text x="340" y="780">52.6 minutes</text>
      <text x="160" y="825">99.999%</text><text x="340" y="825">5.26 minutes</text>
      <text x="160" y="870">99.9999%</text><text x="340" y="870">31.56 seconds</text>
    </g>
    <line x1="125" y1="705" x2="585" y2="705" stroke="#cbb5d2"/>
    <line x1="125" y1="750" x2="585" y2="750" stroke="#cbb5d2"/>
    <line x1="125" y1="795" x2="585" y2="795" stroke="#cbb5d2"/>
    <line x1="125" y1="840" x2="585" y2="840" stroke="#cbb5d2"/>
  </g>

  <!-- Worked example -->
  <g>
    <rect class="box" x="645" y="495" width="860" height="405" fill="#fff0e5" stroke="#c46e35"/>
    <text x="675" y="535" class="section">5. Worked exercise — illustrative assumptions, not real Twitter metrics</text>

    <g class="sketch">
      <rect x="675" y="565" width="290" height="95" rx="14" fill="#fff8d9" stroke="#bc8c24" stroke-width="2.5"/>
      <rect x="995" y="565" width="475" height="95" rx="14" fill="#e5f4ff" stroke="#3b78a5" stroke-width="2.5"/>
    </g>
    <text x="700" y="598" class="label">Assumptions</text>
    <text x="700" y="628" class="small">300M MAU • 50% daily • 2 tweets/day</text>
    <text x="700" y="650" class="small">10% media • 1 MB/media • 5 years</text>

    <text x="1020" y="600" class="formula">DAU = 300M × 50% = 150M</text>
    <text x="1020" y="633" class="formula">Tweets/day = 150M × 2 = 300M</text>

    <text x="690" y="716" class="formula">Average QPS = 300M ÷ 86,400 ≈ 3,500/s</text>
    <text x="690" y="758" class="formula">Peak QPS = 3,500 × 2 ≈ 7,000/s</text>
    <text x="690" y="800" class="formula">Media/day = 300M × 10% × 1 MB ≈ 30 TB/day</text>
    <text x="690" y="842" class="formula">5 years = 30 TB × 365 × 5 ≈ 55 PB</text>

    <rect x="1090" y="870" width="370" height="48" rx="16" fill="#fee3a8" stroke="#b67b14" stroke-width="2"/>
    <text x="1275" y="901" text-anchor="middle" class="label">Process &gt; false precision</text>
  </g>

  <text x="800" y="956" text-anchor="middle" class="subtitle">Assume → calculate with units → round → sanity-check → explain what the number means for the design</text>
  <text x="1515" y="985" text-anchor="end" class="tiny">Original study visual • Alex Xu Vol. 1, Ch. 2 concepts</text>
</svg>
